name: Deploy (Vercel via admin token)

# Why this exists (2026-08-09): the Vercel seat downgrade left only
# admin@rsrvlabs.com able to deploy. On Vercel's personal plan, commits
# authored by anyone else no longer trigger the Git integration (verified:
# PR #47 still had the "Vercel — Deployment completed" check, PR #49 does
# not). This workflow restores push-to-deploy for EVERYONE by deploying
# through a token minted by the admin account — the deploy identity is
# always admin, the trigger can be any merged commit. Costs $0.
#
# One-time setup (admin only — these are credentials, agents never touch them):
#   1. vercel.com (as admin) → Settings → Tokens → create "github-deploy"
#   2. locally, once:  npx vercel link   (as admin, in this repo)
#      then read .vercel/project.json for orgId + projectId
#   3. gh secret set VERCEL_TOKEN      --repo rsrvlabs/www
#      gh secret set VERCEL_ORG_ID     --repo rsrvlabs/www
#      gh secret set VERCEL_PROJECT_ID --repo rsrvlabs/www
# Until all three exist this job fails fast with that instruction, not a
# cryptic CLI error.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets missing. Admin one-time setup: create a token at vercel.com Settings→Tokens, run 'npx vercel link' locally to get org/project ids from .vercel/project.json, then gh secret set all three on rsrvlabs/www."
            exit 1
          fi

      # Remote build on Vercel's side: keeps GitHub minutes ~1/run and the
      # build environment identical to what the dashboard would produce.
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
